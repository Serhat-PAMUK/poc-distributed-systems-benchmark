spring.application.name=poc-distributed-systems

# Redis Cluster

#data.redis.host=localhost
#spring.data.redis.port=6379
spring.data.redis.sentinel.master=mymaster
spring.data.redis.sentinel.nodes=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
spring.data.redis.password=Serhat1234.
#spring.redis.lettuce.pool.max-idle=8
#spring.redis.lettuce.pool.min-idle=0
#spring.redis.lettuce.shutdown-timeout=100ms
spring.data.redis.timeout=2s
spring.data.redis.lettuce.command-timeout=2s
#spring.data.redis.timeout=2000ms


# Profile
spring.profiles.active=external

# Hazelcast
hazelcast.network.port.auto.increment=false
hazelcast.network.port=5701
hazelcast.network.join.multicast.enabled=false
hazelcast.network.join.tcp-ip.enabled=true
hazelcast_servers=hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10